services:
  - type: web
    name: pgbooking-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_NAME
        value: PG Booking API
      - key: APP_VERSION
        value: 1.0.0
      - key: API_PREFIX
        value: /api/v1
      - key: DB_SSL
        value: "true"
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_S3_BUCKET_KYC
        value: pgbooking-kyc
      - key: AWS_S3_BUCKET_PROPERTIES
        value: pgbooking-properties
      - key: AWS_S3_BUCKET_MAINTENANCE
        value: pgbooking-maintenance
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false
